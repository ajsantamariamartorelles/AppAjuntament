name: Detecció de secrets (gitleaks)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Clona el repositori (amb tot l'historial)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # L'acció oficial gitleaks/gitleaks-action exigeix una llicència de
      # pagament per a repositoris d'organitzacions (només és gratuïta per
      # a comptes personals). Gitleaks en si és de codi obert i gratuït:
      # l'executem directament, sense l'acció embolcall.
      - name: Instal·la gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Escaneja secrets
        run: gitleaks detect --source . --verbose --redact
